<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23111113%27/%3E%3Cpath d=%27M14 34 32 18l18 16v14H14z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.5%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#000000">
<title>The Reveal</title>
<style>
:root { --ink: #f4f4f6; --muted: rgba(244,244,246,.56); --rim: rgba(255,255,255,.16); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: var(--ink); overflow: hidden;
  font-family: "Samsung Sharp Sans", Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
#stage { position: fixed; inset: 0; background: #000; }
#dust { position: absolute; inset: 0; width: 100%; height: 100%; }
/* a single soft light from above, like a product shot on black */
#spot { position: absolute; left: 50%; top: -18%; width: 90vmax; height: 70vmax; transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.10), rgba(255,255,255,.035) 38%, transparent 66%); animation: breathe 9s ease-in-out infinite; pointer-events: none; }
#floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(transparent, rgba(255,255,255,.03)); pointer-events: none; }
@keyframes breathe { 50% { opacity: .65; } }
#scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 6vh 6vw 13vh; animation: settle 9s ease-out both; }
@keyframes settle { from { transform: scale(1.035); } to { transform: scale(1); } }
.silver { background: linear-gradient(180deg, #ffffff 10%, #a9a9b2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.rise { opacity: 0; transform: translateY(22px); filter: blur(10px); animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: var(--d, 0s); }
@keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }

/* intro */
.intro { text-align: center; position: relative; width: 100%; }
.intro .line { position: absolute; left: 14%; right: 14%; top: 50%; height: 1px; transform: scaleX(0); background: linear-gradient(90deg, transparent, #fff, transparent);
  box-shadow: 0 0 26px 2px rgba(255,255,255,.55); animation: draw 1.5s .2s cubic-bezier(.7,0,.2,1) forwards, vanish .9s 1.6s ease forwards; }
@keyframes draw { to { transform: scaleX(1); } } @keyframes vanish { to { opacity: 0; } }
.kicker { letter-spacing: .6em; font-size: clamp(10px, 1.3vw, 14px); color: var(--muted); text-transform: uppercase; margin-bottom: 2.4vh; }
.huge { font-weight: 300; letter-spacing: -.04em; line-height: 1.08; font-size: clamp(46px, 11vw, 168px); }
.huge span { display: inline-block; margin: 0 .1em; padding-bottom: .14em; }
.silver { padding-bottom: .06em; }
.sub { margin-top: 3.2vh; color: var(--muted); font-size: clamp(13px, 1.8vw, 22px); font-weight: 400; letter-spacing: .02em; }

/* counters */
.counts { display: flex; gap: clamp(26px, 7vw, 110px); flex-wrap: wrap; justify-content: center; text-align: center; }
.counts b { display: block; font-size: clamp(64px, 14vw, 190px); font-weight: 200; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.counts small { display: block; margin-top: 1vh; font-size: clamp(11px, 1.4vw, 16px); letter-spacing: .34em; text-transform: uppercase; color: var(--muted); }

/* shared matte surfaces */
.tile { width: clamp(84px, 12vw, 160px); aspect-ratio: 1; border-radius: 27%; display: grid; place-items: center; font-size: clamp(42px, 6.4vw, 86px);
  background: linear-gradient(160deg, #202024, #0b0b0d 70%); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 0 0 1px rgba(255,255,255,.05), 0 40px 90px rgba(0,0,0,.9), 0 0 60px rgba(255,255,255,.04);
  position: relative; animation: float 6s ease-in-out infinite; }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.10) 50%, transparent 62%); background-size: 260% 100%; animation: sheen 5s 1.5s ease-in-out infinite; }
@keyframes sheen { from { background-position: 130% 0; } to { background-position: -130% 0; } }
@keyframes float { 50% { transform: translateY(-9px); } }

/* process + project scenes */
.proj { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(24px, 6vw, 96px); align-items: center; width: min(1200px, 100%); }
.pl { text-align: left; }
.num { color: var(--muted); letter-spacing: .34em; font-size: clamp(10px, 1.2vw, 13px); margin-bottom: 2.2vh; }
.pname { margin-top: 3vh; font-size: clamp(36px, 7vw, 98px); font-weight: 300; letter-spacing: -.045em; line-height: 1; }
.ptag { margin-top: 1.6vh; font-size: clamp(14px, 1.8vw, 22px); color: var(--muted); max-width: 30ch; line-height: 1.4; }
.pill { margin-top: 3vh; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 99px; border: 1px solid var(--rim); background: rgba(255,255,255,.04); font-size: clamp(11px, 1.3vw, 15px); color: var(--muted); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.8); }
.pr { position: relative; }
.pr h3 { letter-spacing: .38em; font-size: clamp(10px, 1.2vw, 13px); color: var(--muted); margin-bottom: 3vh; font-weight: 500; }
.rail { position: absolute; left: 25px; top: 54px; bottom: 28px; width: 1px; background: rgba(255,255,255,.12); }
.rail::after { content: ""; position: absolute; inset: 0; background: #fff; transform: scaleY(0); transform-origin: top; animation: grow var(--grow, 5s) linear forwards; animation-delay: var(--gd, 2s); }
@keyframes grow { to { transform: scaleY(1); } }
.st { display: flex; gap: 22px; align-items: center; margin-bottom: clamp(18px, 4vh, 40px); }
.st .n { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 400; font-size: 19px; z-index: 1; background: #070708; border: 1px solid var(--rim);
  opacity: 0; transform: scale(.5); animation: pop .7s cubic-bezier(.2,1.3,.4,1) forwards; animation-delay: var(--d); }
@keyframes pop { to { opacity: 1; transform: none; border-color: #fff; box-shadow: 0 0 24px rgba(255,255,255,.25); } }
.st p { font-size: clamp(16px, 2.2vw, 28px); font-weight: 400; letter-spacing: -.012em; line-height: 1.25; color: #e9e9ee; }
.st p em { font-style: normal; color: #fff; font-weight: 600; }
.who { display: inline-block; font-size: .5em; letter-spacing: .22em; text-transform: uppercase; padding: 3px 9px; margin-left: 10px; border-radius: 99px; border: 1px solid var(--rim); color: var(--muted); vertical-align: middle; }
.who.me { color: #000; background: #fff; border-color: #fff; font-weight: 700; }
.how { width: min(1000px, 100%); } .how .howh { font-size: clamp(32px, 6vw, 84px); font-weight: 300; letter-spacing: -.045em; line-height: 1; margin-bottom: 5vh; }
.how .pr h3 { margin-bottom: 2vh; }

/* credits */
.cred { text-align: center; width: min(1000px, 100%); }
.cred .me { font-size: clamp(64px, 17vw, 240px); font-weight: 200; letter-spacing: -.06em; line-height: .95; }
.cred .me small { display: block; letter-spacing: .5em; font-size: clamp(10px, 1.3vw, 15px); color: var(--muted); font-weight: 500; text-transform: uppercase; margin-bottom: 2vh; }
.cred .say { margin: 2.6vh auto 0; max-width: 40ch; color: var(--muted); font-size: clamp(14px, 1.9vw, 22px); line-height: 1.45; }
.cred .row { margin-top: 5vh; display: flex; gap: clamp(14px, 3vw, 40px); justify-content: center; flex-wrap: wrap; }
.cred .c { text-align: center; max-width: 250px; } .cred .c b { display: block; font-size: clamp(18px, 2.4vw, 30px); font-weight: 400; letter-spacing: -.02em; }
.cred .c span { display: block; margin-top: 6px; color: var(--muted); font-size: clamp(11px, 1.3vw, 15px); line-height: 1.4; }
.cred .c.helper b { font-size: clamp(22px, 3vw, 38px); }

/* finale */
.fin { text-align: center; width: min(1100px, 100%); }
.mosaic { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.5vw, 16px); justify-content: center; margin-bottom: 5vh; }
.mosaic div { width: clamp(46px, 8vw, 92px); aspect-ratio: 1; border-radius: 27%; display: grid; place-items: center; font-size: clamp(22px, 4vw, 46px);
  background: linear-gradient(160deg, #202024, #0b0b0d 70%); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 18px 40px rgba(0,0,0,.8);
  opacity: 0; transform: scale(.4); animation: pop3 .8s cubic-bezier(.2,1.3,.4,1) forwards; animation-delay: var(--d); }
@keyframes pop3 { to { opacity: 1; transform: none; } }
.cta { margin-top: 4vh; display: inline-block; padding: 14px 32px; border-radius: 99px; background: #fff; color: #000; font-weight: 600; text-decoration: none; font-size: clamp(14px, 1.5vw, 17px); }
.hint { margin-top: 4vh; color: var(--muted); letter-spacing: .28em; font-size: clamp(10px, 1.2vw, 13px); text-transform: uppercase; }

/* start screen: browsers only allow sound after a click */
#gate { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.82); text-align: center; padding: 24px; }
#gate .box { display: grid; gap: 14px; justify-items: center; max-width: 440px; }
#gate .huge { font-size: clamp(34px, 7vw, 72px); }
#gate button { padding: 15px 34px; border-radius: 99px; font-weight: 600; font-size: 16px; background: #fff; color: #000; border: 1px solid #fff; transition: transform .15s; }
#gate button:hover { transform: scale(1.04); } #gate button.alt { background: transparent; color: var(--muted); border-color: rgba(255,255,255,.22); font-weight: 500; }
#gate small { color: var(--muted); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
/* controls */
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 4vw calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.85)); transition: opacity .5s; z-index: 5; }
#bar.hide { opacity: 0; pointer-events: none; }
#segs { display: flex; gap: 4px; width: min(880px, 100%); } #segs button { flex: 1; height: 24px; display: flex; align-items: center; }
#segs i { display: block; width: 100%; height: 2px; background: rgba(255,255,255,.2); overflow: hidden; } #segs i b { display: block; height: 100%; width: 0; background: #fff; }
#btns { display: flex; gap: 8px; } #btns button { padding: 8px 16px; border-radius: 99px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.1); font-size: 14px; } #btns button:hover { background: rgba(255,255,255,.18); }
@media (max-width: 760px) {
  .proj { grid-template-columns: 1fr; text-align: center; gap: 22px; } .pl { text-align: center; display: flex; flex-direction: column; align-items: center; } .ptag { max-width: none; }
  .proj .tile { width: 70px; font-size: 36px; } .pname { margin-top: 1.4vh; font-size: 38px; }
  .st { gap: 14px; margin-bottom: 14px; text-align: left; } .st p { font-size: 16px; } .st .n { width: 40px; height: 40px; } .rail { left: 20px; top: 44px; }
  #scene { padding-bottom: 17vh; } .cred .row { gap: 18px; }
}
@media (prefers-reduced-motion: reduce) { #spot, .tile, #scene { animation: none; } .tile::after { animation: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="dust"></canvas><div id="spot"></div><div id="floor"></div><div id="scene"></div></div>
<div id="gate"><div class="box"><div class="kicker">Everything I've built</div><div class="huge silver">The reveal</div>
  <button id="goSound">&#9654;&nbsp; Play with sound</button><button class="alt" id="goSilent">Play without sound</button><small>Best with headphones</small></div></div>
<div id="bar">
  <div id="segs"></div>
  <div id="btns"><button id="prev" aria-label="Previous">&#9198;</button><button id="play" aria-label="Pause">&#10074;&#10074;</button><button id="next" aria-label="Next">&#9197;</button><button id="again" aria-label="Replay">&#8635; Replay</button><button id="snd" aria-label="Sound on or off">&#128266;</button></div>
</div>
<script src="/static/audio.js"></script>
<script>
const PROJECTS = {{ projects|tojson }};
const PROCESS = {{ process|tojson }};
const CREDITS = {{ credits|tojson }};
const framed = window.self !== window.top;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);
const scene = $("#scene");
const host = u => (u ? u.replace(/^https?:\/\//, "") : "coming soon");
const pad = n => String(n).padStart(2, "0");
const who = w => w === "me" ? `<span class="who me">me</span>` : w === "claude" ? `<span class="who">with Claude</span>` : `<span class="who">together</span>`;

const S = [];
S.push({ dur: 6400, build() {
  scene.innerHTML = `<div class="intro"><div class="line"></div>
    <div class="kicker rise" style="--d:1.5s">Introducing</div>
    <div class="huge">${["Everything", "I've", "built."].map((w, i) => `<span class="silver rise" style="--d:${1.8 + i * .3}s">${w}</span>`).join("")}</div>
    <div class="sub rise" style="--d:3.7s">${PROJECTS.length} projects. One student. No shortcuts.</div></div>`;
} });
S.push({ dur: 4800, build() {
  const live = PROJECTS.filter(p => p.url).length;
  const items = [[PROJECTS.length, "projects"], [live, "live on the web"], [1, "real Android app"]];
  scene.innerHTML = `<div class="counts">${items.map((c, i) => `<div class="rise" style="--d:${i * .25}s"><b class="silver" data-to="${c[0]}">0</b><small>${c[1]}</small></div>`).join("")}</div>`;
}, update(t) { scene.querySelectorAll("b[data-to]").forEach(b => { const k = Math.min(1, Math.max(0, (t - 400) / 1500)); b.textContent = Math.round(+b.dataset.to * (1 - Math.pow(1 - k, 3))); }); } });

S.push({ dur: 11500, build() {
  scene.innerHTML = `<div class="how"><div class="howh silver rise" style="--d:.2s">How I made them.</div>
    <div class="pr"><div class="rail" style="--gd:1.4s;--grow:${1.9 * (PROCESS.length - 1)}s"></div>
    ${PROCESS.map((s, i) => `<div class="st rise" style="--d:${1.0 + i * 1.9}s"><div class="n" style="--d:${1.2 + i * 1.9}s">${i + 1}</div><p>${s[1]} ${who(s[0])}</p></div>`).join("")}</div></div>`;
} });

PROJECTS.forEach((p, idx) => S.push({ dur: 8000, build() {
  const grow = 2.1 * (p.made.length - 1);
  scene.innerHTML = `<div class="proj">
    <div class="pl"><div class="num rise" style="--d:.1s">${pad(idx + 1)} / ${pad(PROJECTS.length)}</div>
      <div class="rise" style="--d:.2s"><div class="tile">${p.emoji}</div></div>
      <div class="pname silver rise" style="--d:.5s">${p.name}</div>
      <div class="ptag rise" style="--d:.8s">${p.tag}</div>
      <div class="pill rise" style="--d:1.1s"><i></i>${p.private ? "owner only" : host(p.url)}</div></div>
    <div class="pr"><h3 class="rise" style="--d:1s">HOW I MADE IT</h3>
      <div class="rail" style="--gd:2.2s;--grow:${grow}s"></div>
      ${p.made.map((s, i) => `<div class="st rise" style="--d:${1.4 + i * 2.1}s"><div class="n" style="--d:${1.6 + i * 2.1}s">${i + 1}</div><p>${s}</p></div>`).join("")}
      ${p.ai ? `<div class="pill rise" style="--d:${1.6 + p.made.length * 2.1}s;margin-top:0"><i></i>AI by ${p.ai}</div>` : ""}</div></div>`;
} }));

S.push({ dur: 10000, build() {
  const [me, claude, ...tools] = CREDITS;
  scene.innerHTML = `<div class="cred">
    <div class="me silver rise" style="--d:.2s"><small>Made by</small>${me[0]}</div>
    <div class="say rise" style="--d:1.2s">${me[1]}</div>
    <div class="row">
      <div class="c helper rise" style="--d:2.6s"><b>${claude[0]}</b><span>${claude[1]}</span></div>
      ${tools.map((t, i) => `<div class="c rise" style="--d:${3.4 + i * .6}s"><b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}
    </div></div>`;
} });

S.push({ dur: 8000, build() {
  scene.innerHTML = `<div class="fin"><div class="mosaic">${PROJECTS.map((p, i) => `<div style="--d:${i * .09}s">${p.emoji}</div>`).join("")}</div>
    <div class="huge silver rise" style="--d:1.2s;font-size:clamp(40px,9vw,140px)">Go build<br>something.</div>
    ${framed ? `<div class="hint rise" style="--d:2.4s">Scroll down to explore every project</div>` : `<a class="cta rise" style="--d:2.4s" href="/">Explore every project</a>`}</div>`;
} });

/* what you hear in each scene, timed to the same moments as the pictures */
const P0 = 3, NP = PROJECTS.length, CRED = P0 + NP, FIN = CRED + 1;
function cuesFor(n) {
  const A = window.RevealAudio, pent = A.PENT, c = [], at = (ms, fn) => c.push([ms, fn]);
  if (n === 0) { at(0, () => { A.pad(0); A.riser(undefined, 1.7); }); at(1800, () => { A.boom(); A.chord(0, undefined, 5); }); at(3700, () => A.sparkle()); }
  else if (n === 1) { at(0, () => A.whoosh(undefined, .9)); for (let i = 0; i < 16; i++) at(450 + i * 95, () => A.tick(i / 16)); at(2100, () => { A.pluck(12); A.pluck(19, undefined, .6); }); }
  else if (n === 2) { at(0, () => { A.whoosh(); A.pad(1); }); for (let i = 0; i < PROCESS.length; i++) at(1000 + i * 1900, () => A.pluck(pent[i + 1])); }
  else if (n < CRED) {
    const idx = n - P0; at(0, () => { A.whoosh(undefined, .9, idx % 2 === 0); A.pad(idx % 4); A.boom(undefined, .35); });
    at(500, () => A.pluck(pent[(idx * 2) % 6] - 12, undefined, .8));
    for (let i = 0; i < PROJECTS[idx].made.length; i++) at(1400 + i * 2100, () => A.pluck(pent[(idx + i * 2) % 7 + 2]));
  }
  else if (n === CRED) { at(0, () => { A.whoosh(); A.pad(0); }); at(200, () => { A.boom(undefined, .7); A.chord(0, undefined, 6, 1.2); }); [2600, 3400, 4000, 4600].forEach((ms, i) => at(ms, () => A.pluck(pent[4 + i], undefined, .8))); }
  else { at(0, () => { A.whoosh(); A.pad(2); }); for (let i = 0; i < NP; i++) at(i * 90, () => A.pluck(pent[i % 8], undefined, .5)); at(1200, () => { A.boom(); A.chord(2, undefined, 6, 1.3); A.sparkle(undefined, 22); }); at(3000, () => A.sparkle(undefined, 19)); }
  return c;
}
let started = false;
let cur = -1, t = 0, paused = false, last = performance.now(), lastMove = last;
const segs = $("#segs");
S.forEach((s, i) => { s.dur = reduce ? s.dur * .6 : s.dur; const b = document.createElement("button"); b.setAttribute("aria-label", "Scene " + (i + 1)); b.innerHTML = "<i><b></b></i>"; b.onclick = () => go(i); segs.append(b); });
function go(n) {
  n = (n + S.length) % S.length; cur = n; t = 0; scene.replaceChildren(); scene.style.animation = "none"; void scene.offsetWidth; scene.style.animation = ""; S[n].build(); S[n].cues = cuesFor(n); S[n].ci = 0;
  if (paused) document.getAnimations().forEach(a => a.pause());
  [...segs.children].forEach((b, i) => { b.firstChild.firstChild.style.width = i < n ? "100%" : "0"; });
}
function setPaused(p) { paused = p; document.getAnimations().forEach(a => p ? a.pause() : a.play()); p ? window.RevealAudio.suspend() : window.RevealAudio.resume(); $("#play").innerHTML = p ? "&#9654;" : "&#10074;&#10074;"; }
$("#play").onclick = () => setPaused(!paused); $("#next").onclick = () => go(cur + 1); $("#prev").onclick = () => go(cur - 1); $("#again").onclick = () => { setPaused(false); go(0); };
addEventListener("keydown", e => { if (!started) return; if (e.key === "m" || e.key === "M") $("#snd").click(); else if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1); else if (e.key === " ") { e.preventDefault(); setPaused(!paused); } });
const showBar = () => { $("#bar").classList.remove("hide"); lastMove = performance.now(); };
["pointermove", "pointerdown", "keydown"].forEach(ev => addEventListener(ev, showBar));
function frame(now) {
  const dt = Math.min(64, now - last); last = now;
  if (!paused) { t += dt; const s = S[cur]; if (s.update) s.update(t);
    if (window.RevealAudio.ready()) while (s.ci < s.cues.length && t >= s.cues[s.ci][0]) { try { s.cues[s.ci][1](); } catch (e) { /* never let sound stop the picture */ } s.ci++; }
    segs.children[cur].firstChild.firstChild.style.width = Math.min(100, t / s.dur * 100) + "%";
    if (t >= s.dur) { cur === S.length - 1 ? (t = s.dur) : go(cur + 1); } }
  if (now - lastMove > 2800) $("#bar").classList.add("hide");
  dust(dt); requestAnimationFrame(frame);
}
/* very faint grey dust, like particles in a studio light beam */
const cv = $("#dust"), cx = cv.getContext("2d"); let W, H, P = [];
function size() { const r = devicePixelRatio || 1; W = cv.width = innerWidth * r; H = cv.height = innerHeight * r; P = Array.from({ length: reduce ? 0 : 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .3 + Math.random(), p: Math.random() * 6 })); }
function dust(dt) {
  cx.clearRect(0, 0, W, H); const r = devicePixelRatio || 1;
  for (const q of P) { q.y -= q.z * dt * .014 * r; q.x += Math.sin(q.p += dt * .0005) * .2; if (q.y < -6) { q.y = H + 6; q.x = Math.random() * W; }

}
